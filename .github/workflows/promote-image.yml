name: promote image

on:
  workflow_call:
    inputs:
      image-sha:
        description: Commit SHA of the image just published to GHCR for staging
        required: true
        type: string
    secrets:
      PROMOTION_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: promote-image-${{ github.event_name == 'workflow_dispatch' && 'prd' || 'stg' }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && 'prd' || 'stg' }}
    steps:
      - name: Check promotion token
        env:
          PROMOTION_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          if [ -z "$PROMOTION_TOKEN" ]; then
            echo "::error::Configure the PROMOTION_TOKEN repository secret with Contents and Pull requests write permissions."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare promotion
        id: prepare
        env:
          IMAGE_SHA: ${{ inputs.image-sha }}
        run: python3 .github/scripts/prepare-promotion.py

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.prepare.outputs.promote == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before committing
        if: steps.prepare.outputs.promote == 'true'
        run: go test ./...

      - name: Open or update promotion PR
        if: steps.prepare.outputs.promote == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PROMOTION_TOKEN }}
          base: main
          branch: chore/promote-${{ env.TARGET_ENV }}
          add-paths: ${{ steps.prepare.outputs.file }}
          commit-message: 'chore(deploy): promote ${{ steps.prepare.outputs.tag }} to ${{ env.TARGET_ENV }}'
          title: 'chore(deploy): promote ${{ steps.prepare.outputs.tag }} to ${{ env.TARGET_ENV }}'
          body: |
            Promote `${{ steps.prepare.outputs.tag }}` to `${{ env.TARGET_ENV }}`.

            ${{ steps.prepare.outputs.reason }}

            Merge this PR to deploy through doco-cd. For production, confirm that
            this exact image was deployed and tested in staging before merging.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
